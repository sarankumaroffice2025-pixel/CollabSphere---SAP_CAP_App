_schema-version: 3.3.0
ID: collabSphere_Cap_App
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: collabSphere_Cap_App-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: collabSphere-db
      - name: collabSphere_Cap_App-auth
      - name: collabSphere-credstore

  - name: collabSphere_Cap_App-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: collabSphere-db

  - name: collabSphere_Cap_App-approuter
    type: approuter.nodejs
    path: approuter
    parameters:
      keep-existing-routes: true
      disk-quota: 512M
      memory: 256M
    build-parameters:
      builder: npm
      ignore:
        - node_modules/
        - default-env.json
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: collabSphere_Cap_App-auth

resources:
  - name: collabSphere-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: collabSphere-credstore
    # Instance was created manually in the BTP cockpit ("Credential_Store");
    # bind to it without letting the deployer create or delete it.
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: Credential_Store
  - name: collabSphere_Cap_App-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: collabSphere_Cap_App-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
 
